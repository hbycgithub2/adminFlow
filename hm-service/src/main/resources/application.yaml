server:
  port: 8080
spring:
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 200ms
  application:
    name: hm-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hmall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8088 # sentinel的控制台地址
      http-method-specify: true #是否设置请求方式作为资源名称
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 黑马商城接口文档
    description: "黑马商城接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.controller

# Edge TTS 配置
edge-tts:
  command: py -m edge_tts  # edge-tts 命令路径（使用 Python 模块方式）
  timeout: 30              # 超时时间（秒）
  temp-dir: d:/code/adminFlow/temp  # 临时文件目录（使用绝对路径）

# 火山引擎 TTS 配置
volcengine:
  tts:
    api-key: a83eef4b-bde3-4cbf-ac5f-0a35a17b31ad  # 火山引擎 API Key
    resource-id: seed-tts-2.0                      # TTS 服务资源 ID（女声）
    resource-id-big-model: volcano_tts             # 大模型资源 ID（男声/平静系列）
    auto-select-resource-id: false                 # ⭐ 暂时关闭自动选择（API Key没有volcano_tts权限）
    url: https://openspeech.bytedance.com/api/v3/tts/unidirectional  # API 地址
    connect-timeout: 60                            # ⭐ 连接超时（秒）增加到60秒
    request-timeout: 10                            # ⭐ 请求超时（分钟）增加到10分钟
    default-speaker: zh_female_vv_uranus_bigtts    # 默认音色
    default-format: mp3                            # 默认音频格式
    default-sample-rate: 24000                     # 默认采样率
    output-dir: tts                                # 音频输出目录

# Whisper 配置（完全免费的语音识别）
whisper:
  python:
    command: py                                    # Python 命令（py 或 python）
  script:
    path: D:/code/adminFlow/scripts/whisper_transcribe.py  # Whisper 识别脚本路径
  temp:
    dir: D:/code/adminFlow/temp/whisper           # 临时文件目录
  timeout:
    seconds: 60                                    # 超时时间（秒）
hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30000m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
      - /api/edge-tts/**          # Edge TTS 接口（旧，保留兼容）
      - /api/tts/**               # TTS 模块接口（新）
      - /api/volcengine/tts/**    # 火山引擎 TTS 接口
      - /api/document-tts/**      # 文档 TTS 接口（新增）
      - /edge-tts-test.html       # Edge TTS 测试页面
      - /tts-test.html            # TTS 测试页面（新）
      - /volcengine-tts-test.html # 火山引擎 TTS 测试页面
      - /document-tts-test.html   # 文档 TTS 测试页面（新增）
      - /**/*.html                # 所有静态 HTML 页面
      - /**/*.js                  # 所有 JS 文件
      - /**/*.css                 # 所有 CSS 文件
# keytool -genkeypair -alias hmall -keyalg RSA -keypass hmall123 -keystore hmall.jks -storepass hmall123
