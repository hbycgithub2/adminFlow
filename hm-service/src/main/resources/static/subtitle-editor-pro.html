<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字幕编辑器专业版 - 实时预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .top-toolbar {
            height: 60px;
            background: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toolbar-left h1 {
            font-size: 20px;
            color: #fff;
            margin-right: 30px;
        }

        .toolbar-left input {
            width: 320px;
            padding: 8px 15px;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .toolbar-left input:focus {
            outline: none;
            border-color: #667eea;
        }

        .toolbar-right {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        /* 主内容区域 */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* 左侧：视频预览区 */
        .preview-panel {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            min-width: 640px;
        }

        .video-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #videoPlayer {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        #subtitleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .empty-video {
            color: #666;
            text-align: center;
            font-size: 18px;
        }

        /* 视频控制栏 */
        .video-controls {
            height: 80px;
            background: #2a2a2a;
            border-top: 1px solid #3a3a3a;
            padding: 15px 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #3a3a3a;
            border-radius: 3px;
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .progress-handle {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            left: 0%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            width: 36px;
            height: 36px;
            background: #3a3a3a;
            border: none;
            border-radius: 5px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #4a4a4a;
        }

        .time-display {
            color: #999;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        /* 右侧：编辑面板 */
        .edit-panel {
            width: 450px;
            background: #2a2a2a;
            border-left: 1px solid #3a3a3a;
            display: flex;
            flex-direction: column;
        }

        /* 字幕列表 */
        .subtitle-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .subtitle-item {
            background: #1a1a1a;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .subtitle-item:hover {
            background: #252525;
        }

        .subtitle-item.active {
            border-color: #667eea;
            background: #252525;
        }

        .subtitle-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .subtitle-id {
            color: #999;
            font-size: 13px;
        }

        .subtitle-time {
            color: #667eea;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .subtitle-text {
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 样式编辑器 */
        .style-editor {
            height: 400px;
            border-top: 1px solid #3a3a3a;
            padding: 20px;
            overflow-y: auto;
        }

        .style-editor h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #999;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* 字体大小滑块 */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #3a3a3a;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            display: inline-block;
            background: #3a3a3a;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 13px;
            color: #e0e0e0;
            margin-left: 10px;
        }

        /* 颜色选择器 */
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 位置九宫格 */
        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .position-btn {
            aspect-ratio: 1;
            background: #1a1a1a;
            border: 2px solid #3a3a3a;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 20px;
        }

        .position-btn:hover {
            background: #252525;
            border-color: #4a4a4a;
        }

        .position-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }

        /* 加载状态 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-content {
            text-align: center;
            color: #fff;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #3a3a3a;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 提示信息 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            z-index: 10000;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translate(-50%, -20px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="top-toolbar">
        <div class="toolbar-left">
            <h1>🎬 字幕编辑器专业版</h1>
            <input type="text" id="taskIdInput" placeholder="输入任务ID..." />
            <button class="btn btn-primary" onclick="app.loadSubtitles()">加载字幕</button>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-success" id="saveBtn" onclick="app.saveSubtitles()" disabled>💾 保存修改</button>
            <button class="btn btn-success" id="regenerateBtn" onclick="app.regenerateVideo()" disabled>🎥 重新生成视频</button>
            <button class="btn btn-secondary" onclick="window.location.href='subtitle-editor.html'">返回简单版</button>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-container">
        <!-- 左侧：视频预览 -->
        <div class="preview-panel">
            <div class="video-container" id="videoContainer">
                <video id="videoPlayer" crossorigin="anonymous"></video>
                <canvas id="subtitleCanvas"></canvas>
                <div class="empty-video" id="emptyVideo">
                    <p>👆 请输入任务ID并点击"加载字幕"</p>
                    <p style="font-size: 14px; color: #555; margin-top: 10px;">加载后可实时预览字幕效果</p>
                </div>
            </div>

            <!-- 视频控制栏 -->
            <div class="video-controls">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-handle" id="progressHandle"></div>
                </div>
                <div class="control-buttons">
                    <button class="control-btn" id="playBtn" onclick="app.togglePlay()" disabled>▶</button>
                    <button class="control-btn" onclick="app.skipBackward()" disabled>⏪</button>
                    <button class="control-btn" onclick="app.skipForward()" disabled>⏩</button>
                    <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                </div>
            </div>
        </div>

        <!-- 右侧：编辑面板 -->
        <div class="edit-panel">
            <!-- 字幕列表 -->
            <div class="subtitle-list" id="subtitleList">
                <div style="color: #666; text-align: center; padding: 40px 20px;">
                    <p>暂无字幕</p>
                    <p style="font-size: 13px; margin-top: 10px;">请先加载任务</p>
                </div>
            </div>

            <!-- 样式编辑器 -->
            <div class="style-editor" id="styleEditor" style="display: none;">
                <h3>编辑字幕 - 序号 <span id="editSubtitleId">-</span></h3>

                <div class="form-group">
                    <label>文本内容</label>
                    <textarea id="editText" maxlength="100" oninput="app.onStyleChange()"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>开始时间（秒）</label>
                        <input type="number" id="editStartTime" step="0.1" min="0" oninput="app.onStyleChange()" />
                    </div>
                    <div class="form-group">
                        <label>持续时间（秒）</label>
                        <input type="number" id="editDuration" step="0.1" min="0.1" oninput="app.onStyleChange()" />
                    </div>
                </div>

                <div class="form-group">
                    <label>字体名称</label>
                    <select id="editFontName" onchange="app.onStyleChange()">
                        <option value="Microsoft YaHei">微软雅黑</option>
                        <option value="SimHei">黑体</option>
                        <option value="SimSun">宋体</option>
                        <option value="Arial">Arial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>字体大小 <span class="slider-value" id="fontSizeValue">64</span></label>
                    <input type="range" id="editFontSize" min="24" max="96" value="64" oninput="app.onFontSizeChange()" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>字体颜色</label>
                        <input type="color" id="editFontColor" value="#FFFFFF" onchange="app.onStyleChange()" />
                    </div>
                    <div class="form-group">
                        <label>边框颜色</label>
                        <input type="color" id="editBorderColor" value="#000000" onchange="app.onStyleChange()" />
                    </div>
                </div>

                <div class="form-group">
                    <label>边框粗细</label>
                    <input type="range" id="editBorderWidth" min="1" max="5" value="3" oninput="app.onStyleChange()" />
                </div>

                <div class="form-group">
                    <label>字幕位置</label>
                    <div class="position-grid" id="positionGrid">
                        <div class="position-btn" data-position="7" onclick="app.setPosition(7)">↖</div>
                        <div class="position-btn" data-position="8" onclick="app.setPosition(8)">↑</div>
                        <div class="position-btn" data-position="9" onclick="app.setPosition(9)">↗</div>
                        <div class="position-btn" data-position="4" onclick="app.setPosition(4)">←</div>
                        <div class="position-btn" data-position="5" onclick="app.setPosition(5)">●</div>
                        <div class="position-btn" data-position="6" onclick="app.setPosition(6)">→</div>
                        <div class="position-btn" data-position="1" onclick="app.setPosition(1)">↙</div>
                        <div class="position-btn" data-position="2" onclick="app.setPosition(2)">↓</div>
                        <div class="position-btn" data-position="3" onclick="app.setPosition(3)">↘</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>动画效果</label>
                    <select id="editAnimationType" onchange="app.onStyleChange()">
                        <option value="fade">渐入渐出</option>
                        <option value="slide_up">从下飞入</option>
                        <option value="slide_down">从上飞入</option>
                        <option value="slide_left">从左飞入</option>
                        <option value="slide_right">从右飞入</option>
                        <option value="zoom_in">缩放进入</option>
                        <option value="bounce">弹跳效果</option>
                        <option value="none">无动画</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载状态 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingText">处理中...</p>
        </div>
    </div>

    <!-- 提示信息 -->
    <div class="toast" id="toast"></div>

    <script src="subtitle-editor-pro.js"></script>
</body>
</html>
